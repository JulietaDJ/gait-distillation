# ==========================================
# Fase 1: Feature Distillation
# ==========================================

data_cfg:
  dataset_name: CASIA-B
  dataset_root: /opt3/data/julieta/CASIA-B-yolo-pkl
  dataset_partition: ./datasets/CASIA-B/CASIA-B.json
  teacher_root: /opt3/data/julieta/vhuman_features
  num_workers: 1
  remove_no_gallery: false
  test_dataset_name: CASIA-B

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 0
  save_name: StudentDistill_Phase1
  eval_func: evaluate_indoor_dataset
  sampler_cfg:
    sampler_name: None
  transform:
    - type: BaseSilCuttingTransform
      cutting: true
      size: [64, 44]
  metric: euc
  loss:
    - type: CrossEntropyLoss
      weight: 1.0
    - type: TripletLoss
      weight: 1.0
      margin: 0.2

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true
  - loss_term_weight: 1.0
    type: DistillationLoss
    log_prefix: distill
    w_l1: 1.0
    w_cos: 1.0

model_cfg:
  model: StudentDistill
  Backbone:
    mode: 2d               
    in_channels: 1
    layers: [1, 1, 1, 1]   
    channels: [64, 128, 256, 512]
  SeparateBNNecks:
    class_num: 74         
  use_emb2: false

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005

scheduler_cfg:
  scheduler: MultiStepLR
  milestones: [20000, 40000, 50000]
  gamma: 0.1

trainer_cfg:
  find_unused_parameters: True
  enable_float16: true
  log_iter: 100
  log_interval: 100
  fix_BN: false
  log_train_accuracy: false
  optimizer_reset: false
  scheduler_reset: false
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 10000
  save_name: StudentDistill_Phase1
  sync_BN: true
  total_iter: 60000
  sampler_cfg:
    sampler_name: None
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomHorizontalFlip
          p: 0.5
        - type: RandomRotate
          degrees: 5
  loss:
    - type: CrossEntropyLoss
      weight: 1.0
    - type: TripletLoss
      weight: 1.0
      margin: 0.2
